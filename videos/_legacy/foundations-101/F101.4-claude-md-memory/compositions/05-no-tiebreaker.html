          position: absolute;

      <div id="root" data-composition-id="s05" data-width="1920" data-height="1080">
        <div class="scene dark">

            <div id="s05-b" class="rv">

                <div class="a">Remove that rule.</div>

              <div id="s05-f2" class="fix rv">

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const arrive = (s, t, y = 46, d = 0.42) => {
            tl.set(s, { opacity: 1, y: y }, t);
            tl.to(s, { y: 0, duration: d, ease: "power4.out" }, t);
          };
          const pop = (s, t) =>
            tl.fromTo(s, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, t);
          arrive("#s05-kicker", 0.2, 30, 0.3);
          arrive("#s05-title", 3.2, 70, 0.5);
          tl.fromTo("#s05-a", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          tl.fromTo("#s05-b", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.4);
          // reactive-displacement: B pushes in, A gives way, both settle
          tl.to("#s05-b", { x: -60, duration: 0.25, ease: "power2.in" }, 5.7);
          tl.to("#s05-a", { x: -24, duration: 0.25, ease: "power2.out" }, 5.85);
          tl.to(["#s05-a", "#s05-b"], { x: 0, duration: 0.5, ease: "power3.out" }, 6.1);
          tl.to(["#s05-a", "#s05-b"], { borderColor: "#FF6900", duration: 0.3 }, 5.9);
          pop("#s05-vs", 6.0);
          pop("#s05-warn", 8.0);
          pop("#s05-f1", 10.4);
          tl.fromTo("#s05-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 10.6);
          tl.fromTo("#s05-removed", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 11.1);
          pop("#s05-f2", 13.4);
          gsap.utils.toArray("#s05-f2 .ex > div").forEach((d, i) => arrive(d, 15.2 + i * 0.6, 16, 0.3));
          window.__timelines["s05"] = tl;
        })();
      </script>
    </template>
