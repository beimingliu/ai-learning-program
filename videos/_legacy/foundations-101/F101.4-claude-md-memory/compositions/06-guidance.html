<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Literata"; src: url("assets/fonts/Literata-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-var.woff2") format("woff2"); font-weight: 100 700; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-var.woff2") format("woff2"); font-weight: 100 800; }
        #s06-flow {
          position: absolute;
          top: 60px;
          left: 0;
          width: 1680px;
          height: 300px;
          display: flex;
          align-items: center;
          gap: 0;
        }
        .node {
          width: 360px;
          height: 180px;
          padding: 26px 30px;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .node .n {
          margin-top: 8px;
          font-size: 34px;
          font-weight: 600;
          color: var(--ink);
        }
        .arrow {
          width: 80px;
          height: 40px;
        }
        .arrow path {
          fill: none;
          stroke: var(--blue);
          stroke-width: 4;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #s06-check .n {
          color: var(--ink);
        }
        #s06-not {
          position: absolute;
          top: 400px;
          left: 0;
          width: 1680px;
          display: flex;
          gap: 30px;
        }
        #s06-not .nb {
          flex: 1;
          display: flex;
          align-items: center;
          gap: 18px;
          height: 110px;
          padding: 0 30px;
          font-size: 30px;
          font-weight: 600;
          color: var(--ink);
        }
        .x {
          position: relative;
          display: block;
          flex: 0 0 auto;
          width: 34px;
          height: 34px;
        }
        .x::before,
        .x::after {
          content: "";
          position: absolute;
          left: 15px;
          top: 0;
          width: 5px;
          height: 34px;
          border-radius: 3px;
          background: var(--orange);
        }
        .x::before {
          transform: rotate(45deg);
        }
        .x::after {
          transform: rotate(-45deg);
        }
      </style>
      <div id="root" data-composition-id="s06" data-width="1920" data-height="1080">
        <div class="scene">
          <div class="rail"><span>Guidance, not enforcement</span><span>06 / 09</span></div>
          <div class="rail-rule"></div>
          <div class="head">
            <span id="s06-kicker" class="kicker">Boundary</span>
            <span id="s06-title" class="title">Guidance, <span class="hl">not enforcement.</span></span>
          </div>
          <div class="stage">
            <div id="s06-flow">
              <div id="s06-file" class="node card pale rv"><div class="label">Guides</div><div class="n mono">CLAUDE.md</div></div>
              <svg class="arrow" viewBox="0 0 80 40"><path id="s06-a1" d="M8 20 H68 M56 8 L70 20 L56 32" /></svg>
              <div id="s06-claude" class="node card rv"><div class="label">Does the work</div><div class="n">Claude</div></div>
              <svg class="arrow" viewBox="0 0 80 40"><path id="s06-a2" d="M8 20 H68 M56 8 L70 20 L56 32" /></svg>
              <div id="s06-ans" class="node card rv"><div class="label">Produces</div><div class="n">An answer</div></div>
              <svg class="arrow" viewBox="0 0 80 40"><path id="s06-a3" d="M8 20 H68 M56 8 L70 20 L56 32" /></svg>
              <div id="s06-check" class="node card warn rv"><div class="label" style="color: var(--ink)">You</div><div class="n">Check the work</div></div>
            </div>
            <div id="s06-not">
              <div id="s06-x1" class="nb card rv"><span class="x"></span>It won't block an action</div>
              <div id="s06-x2" class="nb card rv"><span class="x"></span>It won't make an answer right</div>
            </div>
          </div>
          <div class="base-rule"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const arrive = (s, t, y = 46, d = 0.42) => {
            tl.set(s, { opacity: 1, y: y }, t);
            tl.to(s, { y: 0, duration: d, ease: "power4.out" }, t);
          };
          const pop = (s, t) =>
            tl.fromTo(s, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, t);
          ["#s06-a1", "#s06-a2", "#s06-a3"].forEach((id) => {
            const p = document.querySelector(id);
            const len = p.getTotalLength();
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
          });
          arrive("#s06-kicker", 0.1, 30, 0.3);
          arrive("#s06-title", 0.2, 70, 0.5);
          pop("#s06-file", 0.6);
          tl.to("#s06-a1", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.0);
          pop("#s06-claude", 1.3);
          tl.to("#s06-a2", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.7);
          pop("#s06-ans", 2.0);
          pop("#s06-x1", 4.3);
          pop("#s06-x2", 5.6);
          tl.to("#s06-a3", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 7.1);
          pop("#s06-check", 7.4);
          window.__timelines["s06"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
