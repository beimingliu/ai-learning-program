<!DOCTYPE html>

  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Literata"; src: url("assets/fonts/Literata-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-var.woff2") format("woff2"); font-weight: 100 700; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-var.woff2") format("woff2"); font-weight: 100 800; }
        #s08-left {
          position: absolute;
          top: 0;
          left: 0;
          width: 620px;
          height: 580px;
        }
        .cmp {
          position: absolute;
          left: 0;
          width: 620px;
          height: 200px;
          padding: 26px 30px;
        }
        .cmp .line {
          position: relative;
          display: inline-block;
          margin-top: 14px;
          font-size: 30px;
          font-weight: 600;
          line-height: 1.3;
          color: var(--ink);
        }
        .cmp .verdict {
          position: absolute;
          right: 26px;
          top: 22px;
          font-size: 20px;
          padding: 6px 16px;
        }
        #s08-good {
          top: 0;
        }
        #s08-bad {
          top: 230px;
        }
        #s08-bad-strike {
          position: absolute;
          left: -4px;
          right: -4px;
          top: 50%;
          height: 4px;
          border-radius: 2px;
          background: var(--orange);
          transform-origin: left center;
        }
        #s08-steps {
          position: absolute;
          top: 470px;
          left: 0;
          width: 620px;
          display: flex;
          gap: 12px;
        }
        #s08-steps .st {
          flex: 1;
          height: 84px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          border-radius: 14px;
          border: 3px solid var(--line);
          background: #ffffff;
          font-size: 22px;
          font-weight: 700;
          color: var(--muted);
        }
        #s08-term {
          position: absolute;
          top: 0;
          left: 680px;
          width: 1000px;
          height: 580px;
        }
        #s08-body {
          position: relative;
          height: 440px;
          padding: 26px 34px;
          font-size: 24px;
          line-height: 1.6;
        }
        .pane {
          position: absolute;
          left: 34px;
          right: 34px;
          top: 26px;
          opacity: 0;
        }
        .pane .row {
          display: flex;
          gap: 14px;
          white-space: nowrap;
        }
        .opt {
          display: flex;
          align-items: center;
          gap: 14px;
          margin-top: 12px;
          padding: 12px 18px;
          border-radius: 10px;
          border: 1px solid var(--t-border);
          white-space: nowrap;
        }
        .opt .tag {
          margin-left: auto;
          font-size: 20px;
          color: #ffffff;
        }
        .sel {
          display: inline-block;
          width: 1ch;
        }
        .editor {
          margin-top: 14px;
          padding: 16px 20px;
          border-radius: 12px;
          background: var(--t-elev);
          border: 1px solid var(--t-border);
          font-size: 22px;
        }
        .editor .ln {
          display: flex;
          gap: 18px;
          white-space: nowrap;
        }
        .editor .no {
          width: 2ch;
          text-align: right;
          color: var(--t-faint);
        }
        #s08-added {
          background: #1a2e28;
          color: var(--t-green);
        }
        .ctxbox {
          margin-top: 14px;
          padding: 16px 20px;
          border-radius: 12px;
          border: 1px solid var(--t-border);
          font-size: 22px;
        }
        .ctxbox .ln {
          display: flex;
          justify-content: space-between;
          white-space: nowrap;
          padding: 4px 10px;
          border-radius: 8px;
        }
        #s08-hit {
          border: 2px solid var(--t-coral);
        }
        #s08-input {
          position: absolute;
          left: 34px;
          right: 34px;
          bottom: 26px;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 16px 22px;
          border-radius: 12px;
          border: 1px solid var(--t-border);
          background: var(--t-elev);
          font-size: 24px;
          white-space: nowrap;
        }
        #s08-caret {
          display: inline-block;
          width: 11px;
          height: 28px;
          background: var(--t-coral);
        }
      </style>
      <div id="root" data-composition-id="s08" data-width="1920" data-height="1080">
        <div class="scene">
          <div class="rail"><span>Write one line</span><span>08 / 09</span></div>
          <div class="rail-rule"></div>
          <div class="head">
            <span id="s08-kicker" class="kicker">Now try it</span>
            <span id="s08-title" class="title">One rule you've explained <span class="hl">more than once.</span></span>
          </div>
          <div class="stage">
            <div id="s08-left">
              <div id="s08-good" class="cmp card rv">
                <div class="label">Specific</div>
                <span class="verdict pill blue">Keep</span>
                <div class="line mono">"Never modify the source export."</div>
              </div>
              <div id="s08-bad" class="cmp card warn rv">
                <div class="label" style="color: var(--ink)">Vague</div>
                <span class="verdict pill">Too vague</span>
                <div class="line mono">"Be careful with the data."<span id="s08-bad-strike"></span></div>
              </div>
              <div id="s08-steps">
                <div id="s08-st1" class="st rv"><span class="mono">/memory</span></div>
                <div id="s08-st2" class="st rv">Paste</div>
                <div id="s08-st3" class="st rv">New session</div>
                <div id="s08-st4" class="st rv"><span class="mono">/context</span></div>
              </div>
            </div>
            <div id="s08-term" class="term rv">
              <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span>claude</span><span class="t-muted">~/team-project</span></div>
              <div id="s08-body">
                <div id="s08-pick" class="pane">
                  <div class="row"><span class="t-coral">&gt;</span><span>/memory</span></div>
                  <div class="row t-muted" style="margin-top: 10px">Select memory file to edit:</div>
                  <div id="s08-o1" class="opt"><span id="s08-s1" class="sel t-coral">›</span><span>Personal file</span><span class="t-muted">~/.claude/CLAUDE.md</span><span class="tag">just for you</span></div>
                  <div id="s08-o2" class="opt"><span id="s08-s2" class="sel t-coral" style="opacity: 0">›</span><span>Project file</span><span class="t-muted">./CLAUDE.md</span><span class="tag">for your team</span></div>
                </div>
                <div id="s08-edit" class="pane">
                  <div class="row t-muted">Editing ./CLAUDE.md</div>
                  <div class="editor">
                    <div class="ln"><span class="no">1</span><span class="t-info"># Team notes</span></div>
                    <div class="ln"><span class="no">2</span><span>- Metric definitions: docs/metrics.md</span></div>
                    <div id="s08-added" class="ln"><span class="no">3</span><span>+ Never modify the source export.</span></div>
                  </div>
                  <div class="row" style="margin-top: 14px"><span class="t-green">●</span><span>Saved ./CLAUDE.md</span></div>
                </div>
                <div id="s08-new" class="pane"><div class="row t-green">● New session started</div><div class="row t-muted" style="margin-top: 6px">CLAUDE.md files load at the start</div></div>
                <div id="s08-ctx" class="pane">
                                    <div class="row" style="margin-top: 6px"><span class="t-coral">&gt;</span><span>/context</span></div>
                  <div class="ctxbox">
                    <div class="ln t-muted"><span>Memory files (look for yours)</span><span>simplified</span></div>
                    <div class="ln"><span>~/.claude/CLAUDE.md</span><span class="t-muted">loaded</span></div>
                    <div id="s08-hit" class="ln"><span>./CLAUDE.md</span><span class="t-green">✓ loaded</span></div>
                  </div>
                </div>
              </div>
              <div id="s08-input"><span class="t-coral" style="font-weight: 700">&gt;</span><span id="s08-typed"></span><span id="s08-caret"></span></div>
            </div>
          </div>
          <div class="base-rule"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const arrive = (s, t, y = 46, d = 0.42) => {
            tl.set(s, { opacity: 1, y: y }, t);
            tl.to(s, { y: 0, duration: d, ease: "power4.out" }, t);
          };
          const pop = (s, t) =>
            tl.fromTo(s, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, t);
          const step = (s, t) => {
            tl.to(s, { borderColor: "#FF6900", color: "#091F31", backgroundColor: "#FFF4EC", duration: 0.3 }, t);
          };
          arrive("#s08-kicker", 0.2, 30, 0.3);
          arrive("#s08-title", 0.3, 70, 0.5);
          pop("#s08-good", 6.5);
          pop("#s08-bad", 12.0);
          tl.fromTo("#s08-bad-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 13.4);
          pop("#s08-term", 13.0);
          ["#s08-st1", "#s08-st2", "#s08-st3", "#s08-st4"].forEach((s, i) => arrive(s, 13.6 + i * 0.08, 20, 0.3));

          // discrete-text-sequence in the input box
          const SEQ = [
            { t: 0, text: "" },
            { t: 14.3, text: "/" },
            { t: 14.45, text: "/me" },
            { t: 14.6, text: "/mem" },
            { t: 14.75, text: "/memor" },
            { t: 14.9, text: "/memory" },
            { t: 15.4, text: "" },
            { t: 29.0, text: "/" },
            { t: 29.15, text: "/con" },
            { t: 29.3, text: "/cont" },
            { t: 29.45, text: "/contex" },
            { t: 29.6, text: "/context" },
            { t: 30.1, text: "" },
          ];
          const typed = document.getElementById("s08-typed");
          const drv = { t: 0 };
          tl.to(drv, {
            t: 33.5,
            duration: 33.5,
            ease: "none",
            onUpdate: () => {
              let s = "";
              for (let i = SEQ.length - 1; i >= 0; i--) if (drv.t >= SEQ[i].t) { s = SEQ[i].text; break; }
              typed.textContent = s;
            },
          }, 0);
          tl.to("#s08-caret", { opacity: 0, duration: 0.01, repeat: 32, yoyo: true, repeatDelay: 0.5 }, 0.5);

          step("#s08-st1", 15.4);
          tl.set("#s08-pick", { opacity: 1 }, 15.4);
          tl.to("#s08-o1", { borderColor: "#D97757", backgroundColor: "#2e2622", duration: 0.25 }, 16.6);
          tl.to("#s08-o1", { borderColor: "#3A3A3A", backgroundColor: "rgba(0,0,0,0)", duration: 0.25 }, 20.8);
          tl.set("#s08-s1", { opacity: 0 }, 20.8);
          tl.set("#s08-s2", { opacity: 1 }, 20.8);
          tl.to("#s08-o2", { borderColor: "#D97757", backgroundColor: "#2e2622", duration: 0.25 }, 20.8);

          step("#s08-st2", 24.0);
          tl.set("#s08-pick", { opacity: 0 }, 24.0);
          tl.set("#s08-edit", { opacity: 1 }, 24.0);
          tl.fromTo("#s08-added", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 24.4);

          step("#s08-st3", 27.0);
          tl.set("#s08-edit", { opacity: 0 }, 27.0);
          tl.set("#s08-new", { opacity: 1 }, 27.0);
          tl.set("#s08-new", { opacity: 0 }, 30.1);
          step("#s08-st4", 29.0);
          tl.set("#s08-ctx", { opacity: 1 }, 30.1);
          tl.fromTo("#s08-hit", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 30.9);
          window.__timelines["s08"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
