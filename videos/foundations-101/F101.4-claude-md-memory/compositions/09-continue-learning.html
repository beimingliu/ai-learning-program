<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Literata"; src: url("assets/fonts/Literata-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-var.woff2") format("woff2"); font-weight: 100 700; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-var.woff2") format("woff2"); font-weight: 100 800; }
        #s09-card {
          position: absolute;
          top: 0;
          left: 0;
          width: 1100px;
          padding: 36px 44px 40px;
        }
        #s09-card .serif {
          font-size: 42px;
          line-height: 1.25;
          color: var(--ink);
        }
        #s09-pill {
          margin-top: 26px;
        }
        #s09-line {
          display: block;
          margin-top: 30px;
          width: 100%;
          height: 5px;
          border-radius: 3px;
          background: var(--blue);
          transform-origin: left center;
        }
      </style>
      <div id="root" data-composition-id="s09" data-width="1920" data-height="1080">
        <div class="scene">
          <div class="rail"><span>Continue learning</span><span>09 / 09</span></div>
          <div class="rail-rule"></div>
          <div class="head">
            <span id="s09-kicker" class="kicker">Foundations 101</span>
            <span id="s09-title" class="title">Keep learning. <span class="hl">Improve the course.</span></span>
          </div>
          <div class="stage">
            <div id="s09-card" class="card pale rv">
              <div class="serif">Explore other videos in this series, and leave a comment so we can improve the course.</div>
              <div id="s09-pill" class="rv"><span class="pill">#analytics-ai-knowledge-sharing</span></div>
              <span id="s09-line"></span>
            </div>
          </div>
          <div class="base-rule"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const arrive = (s, t, y = 46, d = 0.42) => {
            tl.set(s, { opacity: 1, y: y }, t);
            tl.to(s, { y: 0, duration: d, ease: "power4.out" }, t);
          };
          arrive("#s09-kicker", 0.2, 30, 0.3);
          arrive("#s09-title", 0.3, 70, 0.5);
          tl.fromTo("#s09-card", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 1.0);
          tl.fromTo("#s09-pill", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 4.2);
          tl.fromTo("#s09-line", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.out" }, 4.8);
          window.__timelines["s09"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
